name: VIP Flight Tracker Cron

on:
  schedule:
    # 5分ごとに実行 (GitHub Actions の最短サポートは5分間隔です)
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動実行も可能にする

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run tracker script
        run: python tracker.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add flight_history.csv
          # 変更がある場合のみコミットとプッシュを行うように修正
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update flight history" && git push)